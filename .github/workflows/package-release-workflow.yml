# Publishes the tool on the public infrastructure when a release is published via the UI.
# The release tag (for example v1.1.0) without the leading v becomes the package version.
name: Package Release Workflow

on:
  release:
    types: [published]

permissions:
  contents: read   # checkout
  packages: write  # pull the CI image, publish to the GitHub package registry

jobs:
  release:
    name: Release the package
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/simatic-ax/ci-images/apax-ci-image:4.3.0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Derive version from tag
        id: tag
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: echo "version=${TAG_NAME#v}" >> "$GITHUB_OUTPUT"

      # Must run before packing: the build embeds the version from apax.yml.
      - name: Version package
        uses: simatic-ax/actions/apax-version@v4
        with:
          version: ${{ steps.tag.outputs.version }}
          path: packaging/apax

      - name: Login to required registries
        uses: simatic-ax/actions/apax-login@v4
        with:
          apax-token: ${{ secrets.APAX_TOKEN }}
          registries: |
            https://npm.pkg.github.com/,${{ secrets.GITHUB_TOKEN }}

      # prepack runs `apax run build`: npm ci, typecheck, unit tests, bundle.
      - name: Build and pack
        uses: simatic-ax/actions/apax-pack@v4
        with:
          key: ${{ secrets.APAX_SIGNKEY_V2 }}
          path: packaging/apax

      - name: Publish apax package
        uses: simatic-ax/actions/apax-publish@v4
        with:
          registries: |
            https://npm.pkg.github.com
          path: packaging/apax